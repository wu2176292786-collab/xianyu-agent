<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light;
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        font-size: 13px;
        color: #18181b;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 14px;
      }
      p.hint {
        margin: 0 0 10px;
        color: #71717a;
        font-size: 12px;
        line-height: 1.5;
      }
      label {
        display: block;
        margin-bottom: 4px;
        color: #71717a;
        font-size: 12px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #e4e4e7;
        border-radius: 6px;
        font-size: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .row {
        margin-bottom: 8px;
      }
      button {
        width: 100%;
        padding: 8px;
        border: 0;
        border-radius: 6px;
        background: #18181b;
        color: #fafafa;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.secondary {
        background: #f4f4f5;
        color: #18181b;
      }
      .tasks {
        max-height: 140px;
        overflow: auto;
        margin-bottom: 8px;
      }
      .task {
        display: flex;
        align-items: stretch;
        gap: 4px;
        margin-bottom: 4px;
        border: 1px solid #e4e4e7;
        border-radius: 6px;
        background: #fff;
      }
      .task[data-active="true"] {
        border-color: #18181b;
        background: #f4f4f5;
      }
      .task-pick {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        flex: 1;
        width: auto;
        padding: 7px 8px;
        margin: 0;
        border: 0;
        border-radius: 6px 0 0 6px;
        background: transparent;
        text-align: left;
        color: #18181b;
        font-size: 12px;
      }
      .task small {
        color: #71717a;
        flex-shrink: 0;
      }
      .task-del {
        width: 28px;
        padding: 0;
        margin: 0;
        border: 0;
        border-radius: 0 6px 6px 0;
        background: transparent;
        color: #71717a;
        font-size: 16px;
        line-height: 1;
      }
      .task-del:hover {
        background: #fef2f2;
        color: #991b1b;
      }
      .new-task {
        display: flex;
        gap: 6px;
      }
      .new-task input {
        flex: 1;
      }
      .new-task button {
        width: auto;
        padding: 6px 10px;
        white-space: nowrap;
      }
      #message {
        margin-top: 10px;
        padding: 8px;
        border-radius: 6px;
        background: #f4f4f5;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      #message[data-tone="error"] {
        background: #fef2f2;
        color: #991b1b;
      }
      #message[data-tone="ok"] {
        background: #f0fdf4;
        color: #166534;
      }
      details {
        margin-top: 10px;
        font-size: 12px;
        color: #71717a;
      }
      summary {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>加入研究</h1>
    <p class="hint" id="collect-hint">
      搜索页会在当前标签里点「下一页」，连采的页数跟应用里设定的走。商品详情只采这一页。
    </p>

    <div id="setup" hidden>
      <div class="row">
        <label for="endpoint">应用地址</label>
        <input id="endpoint" value="http://localhost:43117" />
      </div>
      <div class="row">
        <label for="token">采集密钥（在「选品研究」页面底部复制）</label>
        <input id="token" placeholder="32 位十六进制" />
      </div>
      <button id="save">保存并连接</button>
    </div>

    <div id="main" hidden>
      <label>投到哪个研究任务</label>
      <div class="tasks" id="tasks"></div>
      <div class="row new-task">
        <input id="new-task-name" maxlength="40" placeholder="新任务名称" />
        <button type="button" class="secondary" id="add-task">新建</button>
      </div>
      <button id="collect" disabled>加入研究</button>
      <details>
        <summary>设置</summary>
        <p id="current"></p>
        <button class="secondary" id="edit">改地址或密钥</button>
      </details>
    </div>

    <div id="message" hidden></div>

    <details id="apis-box">
      <summary>这一页调了哪些接口</summary>
      <p class="hint" style="margin-top: 6px">
        旁听页面自己发的请求，不用开 DevTools。找「在售商品」「我卖出的」这类接口时用。
      </p>
      <button class="secondary" id="apis">列出来</button>
      <div id="apis-list"></div>
    </details>

    <style>
      #apis-list {
        margin-top: 8px;
      }
      .api {
        padding: 6px 8px;
        margin-bottom: 4px;
        border: 1px solid #e4e4e7;
        border-radius: 6px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        line-height: 1.5;
        word-break: break-all;
      }
      .api .name {
        font-weight: 600;
      }
      .api .data {
        color: #71717a;
      }
    </style>

    <script src="popup.js"></script>
  </body>
</html>
